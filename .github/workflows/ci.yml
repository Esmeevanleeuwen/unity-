name: Unity frontend CI

on:
  push:
    branches: [main, feature/unity-ui-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test Perception model
        run: npm test
      - name: Type-check and build
        run: npm run build
